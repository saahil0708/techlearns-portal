version: '3.8'

services:
  judge-worker:
    image: ${ACR_LOGIN_SERVER:-codeplatform}/codeplatform-judge-worker:${IMAGE_TAG:-latest}
    container_name: codeplatform-judge-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AZURE_SERVICE_BUS_CONNECTION_STRING: ${AZURE_SERVICE_BUS_CONNECTION_STRING:?AZURE_SERVICE_BUS_CONNECTION_STRING must be set}
      AZURE_SERVICE_BUS_QUEUE_NAME: ${AZURE_SERVICE_BUS_QUEUE_NAME:-submissions}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
      JUDGE_IMAGE: ${JUDGE_IMAGE:-codeplatform-judge:latest}
      JUDGE_SETUP_TIMEOUT_MS: ${JUDGE_SETUP_TIMEOUT_MS:-5000}
      JUDGE_COMPILED_SETUP_TIMEOUT_MS: ${JUDGE_COMPILED_SETUP_TIMEOUT_MS:-10000}
    volumes:
      # Mount host Docker socket so the worker can spawn sandboxed code execution containers
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
