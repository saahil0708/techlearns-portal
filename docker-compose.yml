services:
  postgres:
    image: postgres:16-alpine
    container_name: codeplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeplatform
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codeplatform-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  judge:
    build:
      context: ./docker/judge
    image: codeplatform-judge:latest
    profiles: ['judge']

volumes:
  postgres_data:
  redis_data:
