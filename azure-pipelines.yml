# ==============================================================================
# AZURE DEVOPS CI/CD PIPELINE (TechLearns / CodePlatform)
# Automates:
#   1. Validation: Linting, Vitest Server Tests & Next.js Typechecking/Build
#   2. Infrastructure: Azure Bicep Deployment (PostgreSQL, Redis, ACA, ACR, Key Vault)
#   3. Containerization: Docker Build & Push to ACR, update Container Apps
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - saahil/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '22.x'
  PNPM_CACHE_DIR: $(Pipeline.Workspace)/.pnpm-store
  AZURE_SERVICE_CONNECTION: 'Azure-DevOps-Service-Connection'
  RESOURCE_GROUP_NAME: 'rg-techlearns-prod'
  AZURE_LOCATION: 'East US'

stages:
  # ----------------------------------------------------------------------------
  # STAGE 1: TEST & CODE VALIDATION
  # ----------------------------------------------------------------------------
  - stage: Validate
    displayName: '1. Test & Build Validation'
    jobs:
      - job: LintAndTest
        displayName: 'Install, Lint & Test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js $(NODE_VERSION)'

          - script: |
              corepack enable
              corepack prepare pnpm@11.23.0 --activate
              pnpm config set store-dir $(PNPM_CACHE_DIR)
            displayName: 'Enable pnpm package manager'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: $(PNPM_CACHE_DIR)
            displayName: 'Cache pnpm dependencies'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm prisma:generate
            displayName: 'Generate Prisma Client'

          - script: pnpm lint
            displayName: 'Run Oxlint & Static Analysis'

          - script: pnpm test
            displayName: 'Run Vitest Server Test Suite'

          - script: |
              pnpm build:server
              pnpm build:client
            displayName: 'Compile Backend & Frontend Artifacts'

  # ----------------------------------------------------------------------------
  # STAGE 2: INFRASTRUCTURE AS CODE (AZURE BICEP)
  # ----------------------------------------------------------------------------
  - stage: DeployInfra
    displayName: '2. Provision Azure Infrastructure (Bicep)'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BicepDeploy
        displayName: 'Deploy Bicep Template'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy infra/main.bicep'
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(AZURE_SERVICE_CONNECTION)
              action: 'Create Or Update Resource Group'
              resourceGroupName: $(RESOURCE_GROUP_NAME)
              location: $(AZURE_LOCATION)
              templateLocation: 'Linked artifact'
              csmFile: '$(Build.SourcesDirectory)/infra/main.bicep'
              csmParametersFile: '$(Build.SourcesDirectory)/infra/main.parameters.json'
              deploymentMode: 'Incremental'

  # ----------------------------------------------------------------------------
  # STAGE 3: BUILD & DEPLOY CONTAINERS (DOCKER + CONTAINER APPS)
  # ----------------------------------------------------------------------------
  - stage: DeployContainers
    displayName: '3. Build & Deploy Docker Containers'
    dependsOn: DeployInfra
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPushContainers
        displayName: 'Build Docker Images & Update Container Apps'
        steps:
          - task: AzureCLI@2
            displayName: 'Build & Push Docker Containers to ACR'
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # 1. Retrieve ACR login server
                ACR_NAME=$(az acr list --resource-group $(RESOURCE_GROUP_NAME) --query "[0].name" -o tsv)
                ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query "loginServer" -o tsv)
                
                # 2. Login to Azure Container Registry
                az acr login --name $ACR_NAME
                
                # 3. Build & Push Backend Docker Image
                docker build --target backend -t $ACR_LOGIN_SERVER/codeplatform-backend:$(Build.BuildId) -t $ACR_LOGIN_SERVER/codeplatform-backend:latest .
                docker push $ACR_LOGIN_SERVER/codeplatform-backend:$(Build.BuildId)
                docker push $ACR_LOGIN_SERVER/codeplatform-backend:latest
                
                # 4. Build & Push Frontend Docker Image
                docker build --target frontend -t $ACR_LOGIN_SERVER/codeplatform-frontend:$(Build.BuildId) -t $ACR_LOGIN_SERVER/codeplatform-frontend:latest .
                docker push $ACR_LOGIN_SERVER/codeplatform-frontend:$(Build.BuildId)
                docker push $ACR_LOGIN_SERVER/codeplatform-frontend:latest
                
                # 5. Update Azure Container Apps to use newly published image tags
                az containerapp update \
                  --name "codeplatform-backend-prod" \
                  --resource-group $(RESOURCE_GROUP_NAME) \
                  --image "$ACR_LOGIN_SERVER/codeplatform-backend:$(Build.BuildId)"
                
                az containerapp update \
                  --name "codeplatform-frontend-prod" \
                  --resource-group $(RESOURCE_GROUP_NAME) \
                  --image "$ACR_LOGIN_SERVER/codeplatform-frontend:$(Build.BuildId)"
