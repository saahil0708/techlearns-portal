# ==============================================================================
# AZURE DEVOPS CI/CD PIPELINE (TechLearns / CodePlatform)
# Automates:
#   1. Validation: Linting, Vitest Server Tests & Next.js Typechecking/Build
#   2. Infrastructure: Azure Bicep Deployment (PostgreSQL, Redis, ACA, ACR, Key Vault)
#   3. Containerization: Docker Build & Push to ACR, update Container Apps
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - saahil/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '22.x'
  PNPM_CACHE_DIR: $(Pipeline.Workspace)/.pnpm-store
  AZURE_SERVICE_CONNECTION: 'Azure-DevOps-Service-Connection'
  RESOURCE_GROUP_NAME: 'rg-techlearns-prod'
  AZURE_LOCATION: 'East US'

stages:
  # ----------------------------------------------------------------------------
  # STAGE 1: TEST & CODE VALIDATION
  # ----------------------------------------------------------------------------
  - stage: Validate
    displayName: '1. Test & Build Validation'
    jobs:
      - job: LintAndTest
        displayName: 'Install, Lint & Test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js $(NODE_VERSION)'

          - script: |
              corepack enable
              corepack prepare pnpm@11.23.0 --activate
              pnpm config set store-dir $(PNPM_CACHE_DIR)
            displayName: 'Enable pnpm package manager'

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              path: $(PNPM_CACHE_DIR)
            displayName: 'Cache pnpm dependencies'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm prisma:generate
            displayName: 'Generate Prisma Client'

          - script: pnpm lint
            displayName: 'Run Oxlint & Static Analysis'

          - script: pnpm test
            displayName: 'Run Vitest Server Test Suite'

          - script: |
              pnpm build:server
              pnpm build:client
            displayName: 'Compile Backend & Frontend Artifacts'

  # ----------------------------------------------------------------------------
  # STAGE 2: INFRASTRUCTURE AS CODE (AZURE BICEP)
  # ----------------------------------------------------------------------------
  - stage: DeployInfra
    displayName: '2. Provision Azure Infrastructure (Bicep)'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BicepDeploy
        displayName: 'Deploy Bicep Template'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy infra/main.bicep'
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(AZURE_SERVICE_CONNECTION)
              action: 'Create Or Update Resource Group'
              resourceGroupName: $(RESOURCE_GROUP_NAME)
              location: $(AZURE_LOCATION)
              templateLocation: 'Linked artifact'
              csmFile: '$(Build.SourcesDirectory)/infra/main.bicep'
              csmParametersFile: '$(Build.SourcesDirectory)/infra/main.parameters.json'
              deploymentMode: 'Incremental'
